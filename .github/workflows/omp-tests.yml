name: OMP compatibility

on:
  push:
    branches: [omp]
  pull_request:
    branches: [omp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omp-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'w3nash/superpowers'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Test OMP compatibility and release synchronization
        run: >-
          node --test
          tests/omp/test-omp-extension.mjs
          tests/pi/test-pi-extension.mjs
          tests/upstream-sync/test-sync-upstream.mjs
